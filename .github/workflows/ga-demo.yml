name: Ansible Lint and Push Handler

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop
      - release
      - main

jobs:
  handle-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Ansible and Ansible Lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint

      - name: Run appropriate commands
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Running ansible-lint for pull request..."
            ansible-lint -p sample.yml
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Push event triggered on branch: ${{ github.ref_name }}"
          fi
